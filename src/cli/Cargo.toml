[package]
name = "qtrecurit-cli"
version = "0.1.0-beta.3"
edition = "2024"
description = "量潮招聘云命令行工具"
authors = ["QuantTide <opensource@quanttide.com>"]
license = "Apache-2.0"
repository = "https://github.com/quanttide/qtrecurit"

[[bin]]
name = "qtrecurit"
path = "src/main.rs"

[lib]
name = "qtrecurit_cli"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
anyhow = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
quanttide-agent = "0.1.0"
once_cell = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
