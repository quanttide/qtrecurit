name: Provider CI

on:
  push:
    branches: [main]
    paths:
      - src/provider/**
      - .github/workflows/provider.yml
  pull_request:
    paths:
      - src/provider/**

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/provider
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
